<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #vaccinated{
            stroke-dashoffset: 0;
            stroke-dasharray: 100;
        }
    </style>
</head>
<body>
    <div class="data-field" data-row="vaccination_status" data-item="vaccinated">
        <svg viewBox="0 0 100 10">
            <line 
                x1="0" y1="0" x2="100" y2="0" 
                stroke="red" 
                stroke-width="2" 
                pathLength="100" 
                class="lines"
                id="vaccinated"
            />
        </svg>
    </div>
    <div class="data-field" data-row="vaccination_status" data-item="unvaccinated">
        <p>test</p>
    </div>
    
    <button onclick="prepareExport()">Export dataset as CSV</button>
    <script src="app.js" defer></script>
</body>
</html>
