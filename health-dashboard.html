<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="health-dashboard.css">
  <title>Health Dash Board</title>
</head>
<body>
  <nav>
    <div class="nav-container">
      <h3 class="survey-result-heading">Survey Result - 
        <span span class="today-date"></span>
      </h3>

      <div class="nav-right">
        <svg class="email-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>

        <div class="divider-line"></div>

        <img src="assets/pfp.png" alt="profile-picture" class="pfp">

        <div class="admin-pfp">
          <p class="username">John Gester Calvo</p>
          <p class="admin-text">(Admin)</p>
        </div>
      </div>
    </div>
  </nav>

  <nav>
    <div class="nav-left">
      <h3 class="heading-nav-left">Surveys</h3>

      <div class="health-button">
        <p>Barangay Health Monitoring System</p>
      </div>
      <div class="vendor-button">
        <p>Public Market Vendor Registration</p>
      </div>
    </div>
  </nav>
  
  
  <script src="health-dashboard.js" defer></script>
</body>
</html>
