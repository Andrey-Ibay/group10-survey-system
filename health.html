<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form - Full Version</title>
    <link rel="stylesheet" href="health.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <nav class="navbar animate-fade-down">
        <div class="nav-container">
            <a href="#" class="nav-brand">Home</a>
            <div class="nav-right">
                <a href="#" class="nav-link">Contact Us</a>
                <a href="#" class="nav-link">About</a>
                <div class="nav-icons">
                    <div class="icon-wrapper">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    </div>
                    <div class="icon-wrapper">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="content-layout">
                <!-- STEPPER SECTION -->
                <div class="stepper-section animate-slide-left">
                    <div class="back-wrapper animate-fade-in">
                        <button onclick="goBack()" class="back-link">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
                            Back
                        </button>
                    </div>
                    <aside class="stepper-aside">
                        <div class="vertical-line"></div>
                        
                        <a href="#section-1" class="step">
                            <span class="step-label">Personal Information</span>
                            <div class="circle"></div>
                        </a>
                        
                        <a href="#section-2" class="step">
                            <span class="step-label">Health Status</span>
                            <div class="circle"></div>
                        </a>
                        
                        <a href="#section-3" class="step">
                            <span class="step-label">Confirmation</span>
                            <div class="circle"></div>
                        </a>
                        
                        <a href="#section-4" class="step">
                            <span class="step-label">End</span>
                            <div class="circle"></div>
                        </a>
                    </aside>
                </div>
    
                <div class="cards-container animate-slide-up">
                </div>
            </div>
        </div>
    </main>
    <!-- TEMPLATE FOR SURVEY SECTIONS -->
    <template id="surveySection">
        <!-- SECTION 1 -->
        <div class="section-wrapper" id="section-1">
            <div class="green-header">PERSONAL INFORMATION</div>
            <div class="form-card">
                <div class="input-box">
                    <label>Full name (LN, FN, M.I.)</label>
                    <input type="text" name="user_name" placeholder="e.g. Dela Cruz, Juan A." required>
                </div>

                <div class="input-box">
                    <label>Age</label>
                    <input type="text" name="age" placeholder="1 - 120">
                </div>

                <div class = "input-box">
                    <label>Date of Birth</label>
                    <div class="dob-input">
                        <input type = "date" name = "date_of_birth" placeholder = "YYYY-MM-DD" required>
                    </div>
                </div>

                <div class="input-box">
                    <label>Telephone Number</label>
                    <div class="tel-input">
                        <input type="tel" name="tel_no" placeholder="e.g 09xx-xxx-xxxx" required>
                    </div>
                    <br>

                <div class ="input-box">
                    <label>Emergency Contact</label>
                    <div class="tel-input">
                        <input type="tel" name="emergency_contact" placeholder="e.g. 09xx-xxx-xxxx" required>
                    </div>
                </div>

                <div class="input-box">
                    <label>Gender</label>
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="sex" value="male"> Male</label>
                        <label class="radio-btn"><input type="radio" name="sex" value="female"> Female</label>
                    </div>
                </div>

                <div class="input-box">
                    <label>Address</label>
                    <input type="text" name="address" placeholder="Sta. Mesa">
                </div>
                
                <div class="input-box">
                    <label>Last Medical Checkup</label>
                    <div class = "dob-input">
                        <input type="date" name="last_checkup" id="checkup" placeholder="YYYY-MM-DD" required>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- SECTION 2 -->
        <div class="section-wrapper" id="section-2">
            <div class="green-header">HEALTH STATUS</div>
                <div class="form-card">
                    <div class="input-box">
                        <label>Vaccination Status</label>
                        <select name="vaccination_status" class="custom-select">
                            <option value="" disabled selected>Choose your answer</option>
                            <option value="unvaccinated">Unvaccinated</option>
                            <option value="partially_vaccinated">Partially Vaccinated</option>
                            <option value="vaccinated">Vaccinated</option>
                        </select>
                    </div>
                </div>
                <div class="form-card">
                    <div class="input-box">
                        <label>Recent Symptoms</label>
                        <div class="radio-group">
                            <label class="radio-btn"><input type="checkbox" name="symptoms" value="fever"> Fever</label>
                            <label class="radio-btn"><input type="checkbox" name="symptoms" value="cough"> Cough</label>
                            <label class="radio-btn"><input type="checkbox" name="symptoms" value="fatigue"> Fatigue</label>
                            <label class="radio-btn"><input type="checkbox" name="symptoms" value="loss_of_taste_smell"> Lost of Taste/Smell </label>
                            <label class="radio-btn"><input type="checkbox" name="symptoms" value="others"> Others </label>
                            <input type="text" name="other_symptoms" placeholder="Specify Here...">
                        </div>
                        <br>
                <div class = "input-box">
                    <label> Existing Conditions </label>
                    <input type = "text" name = "conditions" placeholder = "Type your answer here...">
                </div>    
            </div>
        </div>
                
                <div class = "form-card">
                <div class = "input-box">
                    <br>
                    <label> Do you have regular access to the Barangay Health Center or a primary care physician for your medical needs? </label>
                    <div class = "radio-group">
                            <label class="radio-btn"><input type="radio" name="access" value="yes"> Yes </label>
                            <label class="radio-btn"><input type="radio" name="access" value="no"> No </label>
                            <label class="radio-btn"><input type="radio" name="access" value="prefer_not_to_say"> Prefer not to say </label>
                        
                        </div>
                    <br>
                   <label> Are you currently taking any daily prescription medications for maintenance (e.g., for blood pressure, cholesterol, heart conditions)? </label>
                    <div class = "radio-group">
                        <label class="radio-btn"><input type="radio" name="medication" value="yes"> Yes </label>
                        <label class="radio-btn"><input type="radio" name="medication" value="no"> No </label>
                        </div>
                    <br>
                    <label> Which of the following best describes your current smoking or vaping habits? </label>
                    <div class = "radio-group">
                        <label class="radio-btn"><input type="radio" name="smoking" value="daily"> I smoke/vape daily </label>
                        <label class="radio-btn"><input type="radio" name="smoking" value="occasionally"> I smoke/vape occasionally (socially) </label>
                        <label class="radio-btn"><input type="radio" name="smoking" value="quit"> I used to smoke/vape but have quit </label>
                        <label class="radio-btn"><input type="radio" name="smoking" value="never"> I have never smoked/vaped </label>
                        </div>
                    <br>
                    <label> How often do you consume alcoholic beverages? </label>
                    <div class = "radio-group">
                        <label class="radio-btn"><input type="radio" name="alcohol" value="never"> Never </label>
                        <label class="radio-btn"><input type="radio" name="alcohol" value="1_to_3_months"> 1-3 times a month </label>
                        <label class="radio-btn"><input type="radio" name="alcohol" value="1_to_3_times_a_week"> 1-3 times a week </label>
                        <label class="radio-btn"><input type="radio" name="alcohol" value="4_or_more_times_a_week"> 4 or more times a week </label>
                        </div>
                    <br>
                    <label> On average, how many days a week do you engage in at least 30 minutes of moderate to vigorous physical activity (e.g., brisk walking, sports, heavy manual labor)? </label>
                    <div class = "radio-group">
                        <label class="radio-btn"><input type="radio" name="exercise" value="0_days"> 0 days (Primarily Sedentary) </label>
                        <label class="radio-btn"><input type="radio" name="exercise" value="1_to_2_days"> 1-2 days </label>
                        <label class="radio-btn"><input type="radio" name="exercise" value="3_to_4_days"> 3-4 days </label>
                        <label class="radio-btn"><input type="radio" name="exercise" value="5_or_more_days"> 5 or more days </label>
                    </div>
                    <br>
                    <label> On a typical night, how many hours of sleep do you usually get? </label>
                    <div class = "radio-group">
                        <label class="radio-btn"><input type="radio" name="sleep" value="less_than_5"> Less than 5 hours </label>
                        <label class="radio-btn"><input type="radio" name="sleep" value="5_to_6"> 5-6 hours </label>
                        <label class="radio-btn"><input type="radio" name="sleep" value="7_to_8"> 7-8 hours </label>
                        <label class="radio-btn"><input type="radio" name="sleep" value="more_than_8"> More than 8 hours </label>
                        </div>
                    <br>
                    <label> In the past 14 days, have you been in close contact with anyone formally diagnosed with a highly contagious illness (e.g., COVID-19, Tuberculosis)? </label>
                    <div class = "radio-group">
                        <label class="radio-btn"><input type="radio" name="contact_contagious_14days" value="yes"> Yes </label>
                        <label class="radio-btn"><input type="radio" name="contact_contagious_14days" value="no"> No </label>
                        <label class="radio-btn"><input type="radio" name="contact_contagious_14days" value="unsure"> Unsure </label>
                    </div>
                    <br>
                    <label> Have you or anyone currently living in your household been diagnosed with Dengue or Typhoid fever in the past 6 months? </label>    
                    <div class = "radio-group">
                        <label class="radio-btn"><input type="radio" name="dengue_typhoid_6months" value="yes"> Yes </label>
                        <label class="radio-btn"><input type="radio" name="dengue_typhoid_6months" value="no"> No </label>
                        <label class="radio-btn"><input type="radio" name="dengue_typhoid_6months" value="unsure"> Unsure </label>
                    </div>
                    <br>
                    <label> Over the past 2 weeks, how often have you felt down, unusually stressed, or overly anxious? </label>
                    <div class = "radio-group">
                        <label class="radio-btn"><input type="radio" name="mental_health_2weeks" value="not_at_all"> Not at all </label>
                        <label class="radio-btn"><input type="radio" name="mental_health_2weeks" value="several_days"> Several days </label>
                        <label class="radio-btn"><input type="radio" name="mental_health_2weeks" value="more_than_half"> More than half the days </label>
                        <label class="radio-btn"><input type="radio" name="mental_health_2weeks" value="nearly_every_day"> Nearly every day </label>
                   </div>

                </div>
                </div>

                <div class ="form-card">
                <div class="input-box">
                    <label>Additional Health Notes</label>
                    <textarea name="additional_notes" placeholder="Type your notes here..."></textarea>
                </div>
            </div>
        </div>
        <button id="nextBtn" onclick="navigate('/confirmation')">Next</button>
    </template>
    <!--  Template for confirmation page  -->
    <template id="confirmationSection">
            <!-- SECTION 3 -->
            <div class="section-wrapper" id="section-3">
                <div class="green-header confirmation-header">CONFIRMATION - Please Review Your Information Carefully</div>
                <div class="form-card confirmation-card">
                    <h3 class="conf-title">PERSONAL INFORMATION</h3>
                    <table class="conf-table">
                        <tr>
                            <td class="conf-label">Full Name</td>
                            <td class="conf-value" id="username"></td>
                        </tr>
                        <tr>
                            <td class="conf-label">Age</td>
                            <td class="conf-value" id="age"></td>
                        </tr>
                        <tr>
                            <td class="conf-label">Date of Birth</td>
                            <td class="conf-value" id="dob"></td>
                        </tr>
                        <tr>
                            <td class="conf-label">Emergency Contact</td>
                            <td class="conf-value" id="emergency_contact"></td>
                        </tr>
                        <tr>
                            <td class="conf-label">Gender</td>
                            <td class="conf-value" id="gender"></td>
                        </tr>
                        <tr>
                            <td class="conf-label">Address</td>
                            <td class="conf-value" id="address"></td>
                        </tr>
                        <tr>
                            <td class="conf-label">Last Medical Check-up</td>
                            <td class="conf-value" id="last_medical_checkup"></td>
                        </tr>
                    </table>
                </div>
                <div class="section-wrapper" id="section-2">
                    <div class="green-header">HEALTH STATUS</div>
                        <div class="form-card">
                            <div class="input-box">
                                <label>Vaccination Status</label>
                                <p id="vaccination_status"></p>
                            </div>
                        </div>
                        <div class="form-card">
                            <div class="input-box">
                                <label>Recent Symptoms</label>
                                <div class="radio-group">
                                    <p id="symptoms"></p>
                                    Others:
                                    <p id="other_symptoms"></p> 
                                </div>
                                <br>
                        <div class = "input-box">
                            <label> Existing Conditions </label>
                            <p id="conditions"></p>
                        </div>    
                    </div>
                </div>
                        
                        <div class = "form-card">
                        <div class = "input-box">
                            <br>
                            <label> Do you have regular access to the Barangay Health Center or a primary care physician for your medical needs? </label>
                            <div class = "radio-group">
                                    <p id="access"></p>
                                </div>
                            <br>
                        <label> Are you currently taking any daily prescription medications for maintenance (e.g., for blood pressure, cholesterol, heart conditions)? </label>
                            <div class = "radio-group">
                                <p id="medication"></p>
                            </div>
                            <br>
                            <label> Which of the following best describes your current smoking or vaping habits? </label>
                            <div class = "radio-group">
                                <p id="smoking"></p>
                            </div>
                            <br>
                            <label> How often do you consume alcoholic beverages? </label>
                            <div class = "radio-group">
                                <p id="alcohol"></p>
                            </div>
                            <br>
                            <label> On average, how many days a week do you engage in at least 30 minutes of moderate to vigorous physical activity (e.g., brisk walking, sports, heavy manual labor)? </label>
                            <div class = "radio-group">
                                <p id="exercise"></p>
                            </div>
                            <br>
                            <label> On a typical night, how many hours of sleep do you usually get? </label>
                            <div class = "radio-group">
                                <p id="sleep"></p>
                            </div>
                            <br>
                            <label> In the past 14 days, have you been in close contact with anyone formally diagnosed with a highly contagious illness (e.g., COVID-19, Tuberculosis)? </label>
                            <div class = "radio-group">
                                <p id="contact_contagious_14days"></p>
                            </div>
                            <br>
                            <label> Have you or anyone currently living in your household been diagnosed with Dengue or Typhoid fever in the past 6 months? </label>    
                            <div class = "radio-group">
                                <p id="dengue_typhoid_6months"></p>
                            </div>
                            <br>
                            <label> Over the past 2 weeks, how often have you felt down, unusually stressed, or overly anxious? </label>
                            <div class = "radio-group">
                                <p id="mental_health_2weeks"></p>
                            </div>
                        </div>
                    </div>
                        <div class ="form-card">
                        <div class="input-box">
                            <label>Additional Health Notes</label>
                            <p id="additional_notes"></p>
                        </div>
                    </div>
                        </div>

                    <div class="form-actions">
                    <button onclick="submitHealthSurvey()" class="btn-submit">SUBMIT</button>
                    </div>
                </div>
            </div>
    </template>
    <template id="finishSection">
        <!-- SECTION 4--> 
        <div class="section-wrapper" id="section-4">
            <div class="green-header">END</div>
            <div class="form-card end-card">
                <h3 class="thank-you-text">Thank you fellow citizen!</h3>
                <p class="response-text">Response recorded.</p>
            </div>
        </div>
    </template>
    <script src="app.js" defer></script>
</body>
</html>
