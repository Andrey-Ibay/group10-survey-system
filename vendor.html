<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form - Full Version</title>
    <link rel="stylesheet" href="vendor.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar animate-fade-down">
        <div class="nav-container">
            <a href="#" class="nav-brand">Home</a>
            <div class="nav-right">
                <a href="#" class="nav-link">Contact Us</a>
                <a href="#" class="nav-link">About</a>
                <div class="nav-icons">
                    <div class="icon-wrapper">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    </div>
                    <div class="icon-wrapper">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="content-layout">
                <!-- STEPPER SECTION -->
                <div class="stepper-section animate-slide-left">
                    <div class="back-wrapper animate-fade-in">
                        <button onclick="goBack()" class="back-link">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
                            Back
                        </button>
                    </div>
                    <aside class="stepper-aside">
                        <div class="vertical-line"></div>
                        
                        <a href="#section-1" class="step">
                            <span class="step-label">Personal Information</span>
                            <div class="circle"></div>
                        </a>
                        
                        <a href="#section-2" class="step">
                            <span class="step-label">Business Information</span>
                            <div class="circle"></div>
                        </a>
                        
                        <a href="#section-3" class="step">
                            <span class="step-label">Confirmation</span>
                            <div class="circle"></div>
                        </a>
                        
                        <a href="#section-4" class="step">
                            <span class="step-label">End</span>
                            <div class="circle"></div>
                        </a>
                    </aside>
                </div>
    
                <div class="cards-container animate-slide-up">
                </div>
            </div>
        </div>
    </main>
    <!-- TEMPLATE FOR SURVEY SECTIONS -->
    <template id="surveySectionVendor">
        <!-- SECTION 1 -->
        <div class="section-wrapper" id="section-1">
            <div class="green-header">PERSONAL INFORMATION</div>
            <div class="form-card">
                <div class="input-box">
                    <label>Registered Owner</label>
                    <input type="text" name="user_name" placeholder="Legal name of the permit holder..">
                </div>
                <div class="input-box">
                    <label>Age</label>
                    <input type="text" name="age" placeholder="1 - 120">
                </div>
                <div class="input-box">
                    <label>Gender</label>
                    <div class="radio-group">
                        <label class="radio-btn"><input type="radio" name="sex" value="male"> Male</label>
                        <label class="radio-btn"><input type="radio" name="sex" value="female"> Female</label>
                        <label class="radio-btn"><input type="radio" name="sex" value ="other"> Other</label>
                    </div>
                </div>
                <div class="input-box">
                    <label>Business Address</label>
                    <input type="text" name="business_address" placeholder="Sta. Mesa">
                </div>
                 <div class="input-box">
                    <label>Contact Number</label>
                    <div class="tel-input">
                    <input type="tel" name="contact_num" placeholder="e.g 09xx-xxx-xxxx" required>
                </div>
            </div>
        </div>
        
        <!-- SECTION 2 -->
        <div class="section-wrapper" id="section-2">
            <div class="green-header">Business Information</div>
                <div class="form-card">
                    <div class ="input-box">
                        <label> Business Trade Name </label>
                        <input type = "text" name = "business_trade_name" placeholder = "D/B/A" required>
                        </div>
                    <div class = "input-box">
                        <label> Telephone Number </label>
                        <div class="tel-input">
                        <input type = "tel" name = "telephone_num" placeholder = "e.g. 09xx-xxx-xxxx">
                    </div>
                    </div>

                </div>

                <div class="form-card">
                    <div class="input-box">
                        <label>Product Category</label>
                        <select class="custom-select" name="product_category">
                            <option value="meat">Meat</option>
                            <option value="veggies">Veggies</option>
                            <option value="dry_goods">Dry Goods</option>
                            <option value="fish">Fish</option>
                            <option value="cooked_food">Cooked Food</option>
                            <option value="others">Others</option>
                        </select>
                    </div>
                </div>
                
                <div class = "form-card">
                <div class = "input-box">
                    <label> Stall Number </label>
                    <div class="stall-input">
                    <input type = "number" name = "stall_num" placeholder = "e.g. 1-500" min="1" max="500" required>
                    <br>  
                    <br>
                    </div>

                    <label>Permit/BIN Number</label>
                    <input type = "text" name = "permit_num" placeholder = "e.g. LLLxx-xxxx" pattern="[a-zA-Z0-9]+" title="Please enter only letters and numbers (no spaces or special characters)." required>
                    <br>
                    <br>

                    <label> Sanitary Permit No. </label>
                    <input type = "text" name = "sanitary_permit_num" placeholder = "LL-xx-xxxx-xxxxx" pattern="[a-zA-Z0-9\-]+" title="Please enter only letters, numbers, and hyphens (no spaces or other special characters)." required>
                    <br>
                    <br>

                    <label> Waste Management </label>
                        <div class="radio-group">
                            <label class="radio-btn"><input type="checkbox" name="waste_management" value="daily_cleaning"> Daily Cleaning</label>
                            <label class="radio-btn"><input type="checkbox" name="waste_management" value="segregation"> Segregation</label>
                            <label class="radio-btn"><input type="checkbox" name="waste_management" value="grease_trap"> Grease Trap</label>
                            <label class="radio-btn"><input type="checkbox" name="waste_management" value="proper_waste_disposal"> Proper Waste Disposal</label>
                            <label class="radio-btn"><input type="checkbox" name="waste_management" value="others"> Others</label>
                            <input type="text" name="waste_management_others" placeholder="Specify Here...">
                        </div>
                    <br>
                    <br>

                    <label>Sanitary Rating</label>
                        <label class="radio-btn"><input type="radio" name="sanitary" value="1"> 1 (poor) </label>
                        <label class="radio-btn"><input type="radio" name="sanitary" value="2"> 2 </label>
                        <label class="radio-btn"><input type="radio" name="sanitary" value="3"> 3 </label>
                        <label class="radio-btn"><input type="radio" name="sanitary" value="4"> 4 </label>
                        <label class="radio-btn"><input type="radio" name="sanitary" value="5"> 5 (excellent) </label>
                    <br>
                    <br>

                    <label> Operating Hours </label>
                    <div class="time-range">
                    <input type="time" name="start_time" class="form-control" required>
                    <span class="separator"> to </span>
                    <input type="time" name="end_time" class="form-control" required>
                    </div>

                </div>
                </div>

                <div class ="form-card">
                <div class="input-box">
                    <label>Additional Notes</label>
                    <textarea name="additional_notes" placeholder="Type your notes here..."></textarea>
                </div>
            </div>
        </div>
        <button id="nextBtn" onclick="navigate('/confirmation')">Next</button>
    </template>
    <!--  Template for confirmation page  -->
    <template id="confirmationSection">
            <!-- SECTION 3 -->
            <div class="section-wrapper" id="section-3">
                <div class="green-header confirmation-header">CONFIRMATION</div>
                <div class="form-card confirmation-card">
                    <h3 class="conf-title">Personal Information</h3>
                    <table class="conf-table">
                        <tr>
                            <td class="conf-label">Registered Owner</td>
                            <td class="conf-value">Dela Cruz, Juan A.</td>
                        </tr>
                        <tr>
                            <td class="conf-label">Age</td>
                            <td class="conf-value">105</td>
                        </tr>
                        <tr>
                            <td class="conf-label">Gender</td>
                            <td class="conf-value">Male</td>
                        </tr>
                        <tr>
                            <td class="conf-label">Business Address</td>
                            <td class="conf-value">Sta. Mesa</td>
                        </tr>
                    </table>
                    <div class="health-notes">
                        <div class="notes-title">Additional Notes</div>
                        <p class="notes-desc">
                            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nam hendrerit nisi sed 
                            sollicitudin pellentesque. Nunc posuere purus rhoncus pulvinar aliquam. Ut aliquet 
                            tristique nisl vitae volutpat.
                        </p>
                    </div>
                    <div class="form-actions">
                    <a href="end.html" class="btn-submit">SUBMIT</a>
                    </div>
                </div>
            </div>
    </template>
    <script src="app.js" defer></script>
</body>
</html>
