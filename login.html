<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="login.css">
<title>Log-In</title>
</head>
<body>
  <div class="login-container">
    <img src="assets/barangaylogo.png" alt="barangay-logo" class="barangay-logo">

    <h3 class="hello-heading">Hello, Admin!</h3>
    <p class="sub-heading">Login to access your account</p>

    <label for="email" class="email">Email</label>
    <img src="assets/email-icon.png" alt="email-icon" class="email-icon">
    <input type="text" name="email" id="email" placeholder="Enter your email" class="input-email">

    <label for="password" class="password">Password</label>
    <img src="assets/password-icon.png" alt="lock-icon" class="password-icon">
    <input type="password" name="password" id="password" placeholder="Enter your password" class="input-password">

    <img src="assets/eye-icon.png" alt="eye-icon" class="eye-icon" onclick="changeIcon()">
    <div class="eye-dash"></div>

    <input type="checkbox" name="remember" id="remember" class="remember">
    <label for="remember" class="remember-label">Remember me</label>

    <p class="forgot-password">Forgot password?</p>

    <button class="login-button">Login</button>

    <button class="close-btn"></button>

    <div class="horizontal-line"></div>
    <p class="msg">have a nice day</p>
  </div>

  <script>
    const eyeDash = document.querySelector(".eye-dash");
    const passwordField = document.querySelector(".input-password");
    const inputField = document.querySelector(".input-email");

    const changeIcon = () => {
      eyeDash.style.display.includes("flex") ? eyeDash.style.display = "none" : eyeDash.style.display = "flex";

      passwordField.type.includes("password") ? passwordField.type = "text" : passwordField.type = "password";
    }

    passwordField.addEventListener("focus", () => {
      eyeDash.style.top = "65.25%";
    });

    passwordField.addEventListener("blur", () => {
      eyeDash.style.top = "65.2%";
    });

    inputField.addEventListener("focus", () => {
      eyeDash.style.top = "65.25%";
      eyeDash.style.right = "36.57%"
    });

    inputField.addEventListener("blur", () => {
      eyeDash.style.top = "65.2%";
      eyeDash.style.right = "36.57%"
    });
  </script>
</body>
</html>
